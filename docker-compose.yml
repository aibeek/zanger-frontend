version: '3.5'

services:
  lawyerplace-frontend:
    container_name: lawyerplace-frontend
    image: ${SERVICE_IMAGE_NAME}:${SERVICE_IMAGE_TAG}
    restart: always
    networks:
      - lawyerplace_network
    ports:
      - "127.0.0.1:3000:3000"

networks:
  lawyerplace_network:
    external: true