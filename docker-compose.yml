version: '3.5'

services:
  lawyerplace-frontend:
    image: ${SERVICE_IMAGE_NAME}:${SERVICE_IMAGE_TAG}
    build:
      context: .
      args:
        - "env_build=${SERVICE_PROFILE}"
      dockerfile: ./.docker/nextjs/Dockerfile
    restart: always
    networks:
      - lawyerplace_network   # 👈 совпадает с backend
    env_file:
      - .env

networks:
  lawyerplace_network:        # 👈 подчёркивание
    external: true
