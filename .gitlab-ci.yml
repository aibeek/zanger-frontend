stages:
  - build
  - deploy

variables:
  DEPLOY_ENV_FILE: "/srv/zanger/web-app/.env"
  PROJECT: "lawyerplace-frontend"

before_script:
  - |
    set -e
    export TAG="$CI_COMMIT_REF_SLUG-$(echo "$CI_COMMIT_TIMESTAMP" | cut -c1-10)-$CI_COMMIT_SHORT_SHA"
    echo "BRANCH: $CI_COMMIT_BRANCH"
    echo "IMAGE TAG: $TAG"
    echo "ENV FILE: $DEPLOY_ENV_FILE"

# ===================== DEV =====================

build_image:
  stage: build
  tags: [prod-web-app]
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - echo ">>> BUILD FRONTEND IMAGE"

    - |
      for v in NEXT_PUBLIC_API_URL NEXT_PUBLIC_BASE_URL NEXT_PUBLIC_BASE_URL_PROD NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY; do
        test -n "${!v}"
      done

    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true

    - |
      docker build -f .docker/nextjs/Dockerfile \
        --cache-from "$CI_REGISTRY_IMAGE:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
        --build-arg NEXT_PUBLIC_BASE_URL="$NEXT_PUBLIC_BASE_URL" \
        --build-arg NEXT_PUBLIC_BASE_URL_PROD="$NEXT_PUBLIC_BASE_URL_PROD" \
        --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" \
        -t "$CI_REGISTRY_IMAGE:$TAG" \
        -t "$CI_REGISTRY_IMAGE:latest" .

    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"

deploy_dev:
  stage: deploy
  tags: [prod-web-app]
  needs: ["build_image"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - echo ">>> DEPLOY FRONTEND (DEV) using repo compose + server env"

    - |
      sed -i "s/^SERVICE_IMAGE_TAG=.*/SERVICE_IMAGE_TAG=${TAG}/" "$DEPLOY_ENV_FILE" || \
      echo "SERVICE_IMAGE_TAG=${TAG}" >> "$DEPLOY_ENV_FILE"

    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

    - cd "$CI_PROJECT_DIR"

    - |
      if docker compose version >/dev/null 2>&1; then
        COMPOSE="docker compose"
      else
        COMPOSE="docker-compose"
      fi

    - $COMPOSE -p "$PROJECT" --env-file "$DEPLOY_ENV_FILE" pull lawyerplace-frontend
    - $COMPOSE -p "$PROJECT" --env-file "$DEPLOY_ENV_FILE" up -d --remove-orphans lawyerplace-frontend

# ===================== NEWFRONT =====================

build_image_newfront:
  stage: build
  tags: [prod-web-app]
  rules:
    - if: '$CI_COMMIT_BRANCH == "newfront"'
  script:
    - echo ">>> BUILD FRONTEND IMAGE (NEWFRONT)"

    - |
      for v in NEXT_PUBLIC_API_URL NEXT_PUBLIC_BASE_URL NEXT_PUBLIC_BASE_URL_PROD NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY; do
        test -n "${!v}"
      done

    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker pull "$CI_REGISTRY_IMAGE:newfront-latest" || true

    - |
      docker build -f .docker/nextjs/Dockerfile \
        --cache-from "$CI_REGISTRY_IMAGE:newfront-latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
        --build-arg NEXT_PUBLIC_BASE_URL="$NEXT_PUBLIC_BASE_URL" \
        --build-arg NEXT_PUBLIC_BASE_URL_PROD="$NEXT_PUBLIC_BASE_URL_PROD" \
        --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" \
        -t "$CI_REGISTRY_IMAGE:$TAG" \
        -t "$CI_REGISTRY_IMAGE:newfront-latest" .

    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:newfront-latest"

deploy_newfront:
  stage: deploy
  tags: [prod-web-app]
  needs: ["build_image_newfront"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "newfront"'
  variables:
    DEPLOY_ENV_FILE: "/srv/zanger/web-app-newfront/.env"
    PROJECT: "zanger-newfront"
  script:
    - echo ">>> DEPLOY FRONTEND (NEWFRONT)"

    - |
      sed -i "s/^SERVICE_IMAGE_TAG=.*/SERVICE_IMAGE_TAG=${TAG}/" "$DEPLOY_ENV_FILE" || \
      echo "SERVICE_IMAGE_TAG=${TAG}" >> "$DEPLOY_ENV_FILE"

    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

    - cd "$CI_PROJECT_DIR"

    - |
      if docker compose version >/dev/null 2>&1; then
        COMPOSE="docker compose"
      else
        COMPOSE="docker-compose"
      fi

    - $COMPOSE -f docker-compose.newfront.yml -p "$PROJECT" --env-file "$DEPLOY_ENV_FILE" pull zanger-newfront
    - $COMPOSE -f docker-compose.newfront.yml -p "$PROJECT" --env-file "$DEPLOY_ENV_FILE" up -d --remove-orphans zanger-newfront