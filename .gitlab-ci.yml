stages:
  - build
  - deploy

variables:
  GA_ID: "G-B7HNWM1W8G"
  DEPLOY_DIR: "/srv/zanger/web-app"
  PROJECT: "lawyerplace-frontend"

# -------------------------------
# COMMON
# -------------------------------
before_script:
  - |
    set -e
    export TAG="$CI_COMMIT_REF_SLUG-$(echo "$CI_COMMIT_TIMESTAMP" | cut -c1-10)-$CI_COMMIT_SHORT_SHA"
    echo "BRANCH: $CI_COMMIT_BRANCH"
    echo "IMAGE TAG: $TAG"
    echo "DEPLOY DIR: $DEPLOY_DIR"

# -------------------------------
# BUILD IMAGE
# -------------------------------
build_image:
  stage: build
  tags: [prod-web-app]
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo ">>> BUILD FRONTEND IMAGE"

    - test -n "$NEXT_PUBLIC_API_URL"
    - test -n "$NEXT_PUBLIC_BASE_URL"
    - test -n "$NEXT_PUBLIC_BASE_URL_PROD"
    - test -n "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"

    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true

    - |
      docker build -f .docker/nextjs/Dockerfile \
        --cache-from "$CI_REGISTRY_IMAGE:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
        --build-arg NEXT_PUBLIC_BASE_URL="$NEXT_PUBLIC_BASE_URL" \
        --build-arg NEXT_PUBLIC_BASE_URL_PROD="$NEXT_PUBLIC_BASE_URL_PROD" \
        --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" \
        -t "$CI_REGISTRY_IMAGE:$TAG" \
        -t "$CI_REGISTRY_IMAGE:latest" .

    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker image prune -f --filter "until=168h"

# -------------------------------
# DEPLOY DEV
# -------------------------------
deploy_dev:
  stage: deploy
  tags: [prod-web-app]
  needs: ["build_image"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - echo ">>> DEPLOY FRONTEND (DEV)"

    - cd "$DEPLOY_DIR"

    # --- update env
    - |
      sed -i "s/^SERVICE_IMAGE_TAG=.*/SERVICE_IMAGE_TAG=${TAG}/" .env || \
      echo "SERVICE_IMAGE_TAG=${TAG}" >> .env

    - |
      sed -i "s/^NEXT_PUBLIC_GA_ID=.*/NEXT_PUBLIC_GA_ID=${GA_ID}/" .env || \
      echo "NEXT_PUBLIC_GA_ID=${GA_ID}" >> .env

    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

    - |
      if docker compose version >/dev/null 2>&1; then
        COMPOSE="docker compose"
      else
        COMPOSE="docker-compose"
      fi

    - $COMPOSE -p "$PROJECT" --env-file .env pull
    - $COMPOSE -p "$PROJECT" --env-file .env up -d --force-recreate

    - docker image prune -f || true
