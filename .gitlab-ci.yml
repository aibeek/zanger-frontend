stages:
  - build
  - deploy

variables:
  GA_ID: "G-B7HNWM1W8G"

before_script:
  - export LAST_ROOT_NAMESPACE="$(echo "$CI_PROJECT_NAMESPACE" | rev | cut -d'/' -f1 | rev)"
  - export NAMESPACE_BASED_BRANCH="${LAST_ROOT_NAMESPACE}-test"
  - if [ "$CI_COMMIT_REF_NAME" = "main" ]; then export NAMESPACE_BASED_BRANCH="${LAST_ROOT_NAMESPACE}"; fi
  - export TAG="$CI_COMMIT_REF_SLUG-$(echo "$CI_COMMIT_TIMESTAMP" | cut -c1-10)-$CI_COMMIT_SHORT_SHA"
  - export HOME_DIR="/app/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME"
  - echo "Namespace for build - ${NAMESPACE_BASED_BRANCH}"
  - echo "Image tag - ${TAG}"

# -------------------------
# 1) BUILD (build+push image)
# -------------------------
build image:
  stage: build
  tags:
    - kulenkov
    - dev
    - ps
  script:
    - echo "# Build Stage start"
    - pwd
    - ls -la
    - ls -la .docker/nextjs || true

    # Проверка: переменные должны быть доступны в job
    - test -n "$NEXT_PUBLIC_API_URL" || (echo "NEXT_PUBLIC_API_URL is missing (check GitLab CI/CD Variables)" && exit 1)
    - test -n "$NEXT_PUBLIC_BASE_URL" || (echo "NEXT_PUBLIC_BASE_URL is missing" && exit 1)
    - test -n "$NEXT_PUBLIC_BASE_URL_PROD" || (echo "NEXT_PUBLIC_BASE_URL_PROD is missing" && exit 1)
    - test -n "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" || (echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY is missing" && exit 1)

    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

    # ВАЖНО: docker build в YAML делаем многострочным блоком
    - |
      docker build -f .docker/nextjs/Dockerfile \
        --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
        --build-arg NEXT_PUBLIC_BASE_URL="$NEXT_PUBLIC_BASE_URL" \
        --build-arg NEXT_PUBLIC_BASE_URL_PROD="$NEXT_PUBLIC_BASE_URL_PROD" \
        --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" \
        -t "$CI_REGISTRY_IMAGE:${TAG}" .

    - docker push "$CI_REGISTRY_IMAGE:${TAG}"
    - echo "# Build Stage end"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# -------------------------
# 2) DEPLOY DEV (pull+up, без down)
# -------------------------
deploy to server:
  stage: deploy
  tags:
    - kulenkov
    - dev
    - ps
  needs: ["build image"]
  script:
    - echo "# Deploy DEV start"
    - echo "update project in $HOME_DIR"

    # safe.directory, чтобы git не ругался
    - git config --global --add safe.directory "$HOME_DIR" || true

    - git -C "$HOME_DIR" reset --hard
    - git -C "$HOME_DIR" checkout -- .
    - git -C "$HOME_DIR" pull origin "$CI_COMMIT_BRANCH"
    - cd "$HOME_DIR"

    # обновляем tag для docker-compose
    - sed -i "s/^SERVICE_IMAGE_TAG=.*/SERVICE_IMAGE_TAG=${TAG}/" "$HOME_DIR/.env.docker-compose"

    # GA ID: replace-or-add (без дублей)
    - |
      if grep -q '^NEXT_PUBLIC_GA_ID=' "$HOME_DIR/.env.docker-compose"; then
        sed -i "s/^NEXT_PUBLIC_GA_ID=.*/NEXT_PUBLIC_GA_ID=${GA_ID}/" "$HOME_DIR/.env.docker-compose"
      else
        echo "NEXT_PUBLIC_GA_ID=${GA_ID}" >> "$HOME_DIR/.env.docker-compose"
      fi

    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

    # ВАЖНО: без down — меньше/нет 502
    - docker compose -p "${LAST_ROOT_NAMESPACE}_${CI_PROJECT_NAME}" --env-file "$HOME_DIR/.env.docker-compose" -f "$HOME_DIR/docker-compose.yml" pull
    - docker compose -p "${LAST_ROOT_NAMESPACE}_${CI_PROJECT_NAME}" --env-file "$HOME_DIR/.env.docker-compose" -f "$HOME_DIR/docker-compose.yml" up -d --remove-orphans

    - docker image prune -f || true

    - echo "# Deploy DEV end"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'